name: Android

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Gradle variant (e.g. FullArm64Release, LiteArm64Release)'
        required: false
        default: 'FullArm64Release'
      release_tag:
        description: 'Release tag to attach the APK to (empty = artifact only)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      MOGRAM_API_ID: ${{ secrets.MOGRAM_API_ID }}
      MOGRAM_API_HASH: ${{ secrets.MOGRAM_API_HASH }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check secrets.
        run: |
          if [ -z "$MOGRAM_API_ID" ] || [ -z "$MOGRAM_API_HASH" ]; then
            echo "::error::Add MOGRAM_API_ID and MOGRAM_API_HASH to the repository secrets."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Android SDK.
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            ndk;29.0.14206865
            cmake;3.22.1

      - name: Signing key and API keys.
        run: |
          mkdir -p TMessagesProj/config
          pass=mogramtemp
          if [ -n "${{ secrets.MOGRAM_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.MOGRAM_KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/config/exteraGram.jks
            alias="${{ secrets.MOGRAM_KEY_ALIAS }}"; pass="${{ secrets.MOGRAM_KEYSTORE_PASSWORD }}"; keypass="${{ secrets.MOGRAM_KEY_PASSWORD }}"
            [ -n "$keypass" ] || keypass="$pass"
          else
            alias=mogram; keypass=mogramtemp
            keytool -genkeypair -keystore TMessagesProj/config/exteraGram.jks \
              -alias "$alias" -storepass "$pass" -keypass "$keypass" \
              -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Mogram"
          fi
          {
            echo "APP_ID = ${MOGRAM_API_ID}"
            echo "APP_HASH = \"${MOGRAM_API_HASH}\""
            echo "MAPS_V2_API = none"
            echo "SIGNING_KEY_PASSWORD = $keypass"
            echo "SIGNING_KEY_ALIAS = $alias"
            echo "SIGNING_KEY_STORE_PASSWORD = $pass"
          } > API_KEYS

      - name: Official Gradle wrapper.
        run: |
          # The wrapper jar in the repository does not match the checksum published by Gradle,
          # so regenerate it from the official distribution and verify it.
          v=9.4.1
          curl -fsSL "https://services.gradle.org/distributions/gradle-$v-bin.zip" -o /tmp/gradle.zip
          echo "$(curl -fsSL https://services.gradle.org/distributions/gradle-$v-bin.zip.sha256)  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-$v/bin/gradle wrapper --gradle-version $v --no-daemon
          echo "$(curl -fsSL https://services.gradle.org/distributions/gradle-$v-wrapper.jar.sha256)  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - uses: gradle/actions/setup-gradle@v4

      - name: Build.
        run: ./gradlew --no-daemon :TMessagesProj:assemble${{ inputs.flavor || 'FullArm64Release' }} --stacktrace

      - name: Collect APKs.
        run: |
          mkdir -p dist
          find TMessagesProj/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          for f in dist/*.apk; do mv "$f" "dist/mogram-$(basename "$f")"; done || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: mogram-apk
          path: dist/*.apk
          retention-days: 14

      - name: Release.
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.release_tag }}" >/dev/null 2>&1 \
            || gh release create "${{ inputs.release_tag }}" --title "Mogram ${{ inputs.release_tag }}" --notes "Build based on exteraGram, see README."
          gh release upload "${{ inputs.release_tag }}" dist/*.apk --clobber
