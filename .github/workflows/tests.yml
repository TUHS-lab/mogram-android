name: Tests

on:
  push:
    branches: [main, plugins]
  pull_request:
  workflow_dispatch:

jobs:
  logic:
    name: Mogram logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run tests.
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out \
            TMessagesProj/src/main/java/org/telegram/messenger/MogramLogic.java \
            tests/MogramLogicTest.java
          java -Dfile.encoding=UTF-8 -cp out MogramLogicTest
